name: Leviata CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Leviata
        run: make

      - name: Run internal demo
        run: ./leviata --demo

      - name: Run language examples
        run: |
          ./leviata exemplos/hello.pt
          ./leviata exemplos/listas.pt
          ./leviata exemplos/matematica.pt
          ./leviata exemplos/jogo.pt
          ./leviata exemplos/motor2d.pt
          ./leviata exemplos/mundo.pt
          ./leviata exemplos/gameplay.pt

      - name: Run core regression suite
        run: |
          ./leviata testes/nucleo.pt | tee /tmp/leviata-core.log
          grep -q "NUCLEO_OK" /tmp/leviata-core.log

      - name: Run gameplay regression suite
        run: |
          ./leviata testes/gameplay.pt | tee /tmp/leviata-gameplay.log
          grep -q "GAMEPLAY_OK" /tmp/leviata-gameplay.log

      - name: Run resource object regression suite
        run: |
          ./leviata testes/recursos.pt | tee /tmp/leviata-resources.log
          grep -q "RECURSOS_OK" /tmp/leviata-resources.log
          rm -f testes/.recurso_tmp.txt testes/.recurso_tmp2.txt

      - name: Run class regression suite
        run: |
          ./leviata testes/classes.pt | tee /tmp/leviata-classes.log
          grep -q "CLASSES_OK" /tmp/leviata-classes.log

      - name: Enforce Leviata 3 canonical surface
        run: |
          cat > /tmp/leviata-legado.pt <<'EOF'
          escrever("forma antiga")
          EOF
          if ./leviata /tmp/leviata-legado.pt; then
            echo "ERRO: escrever() antigo voltou a ser aceito"
            exit 1
          fi

          cat > /tmp/leviata-logica-antiga.pt <<'EOF'
          escreva(verdadeiro && falso)
          EOF
          if ./leviata /tmp/leviata-logica-antiga.pt; then
            echo "ERRO: && voltou a ser aceito como forma canônica"
            exit 1
          fi

      - name: Build with sanitizers
        run: make debug

      - name: Run regressions with sanitizers
        run: |
          ./leviata_debug testes/nucleo.pt
          ./leviata_debug testes/gameplay.pt
          ./leviata_debug testes/recursos.pt
          ./leviata_debug testes/classes.pt
          rm -f testes/.recurso_tmp.txt testes/.recurso_tmp2.txt
