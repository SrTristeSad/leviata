name: Leviata CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Leviata
        run: make

      - name: Run internal demo
        run: ./leviata --demo

      - name: Run language examples
        run: |
          ./leviata exemplos/hello.pt
          ./leviata exemplos/listas.pt
          ./leviata exemplos/mapas.pt
          ./leviata exemplos/mapas_iteracao.pt
          ./leviata exemplos/colecoes_iteracao.pt
          ./leviata exemplos/matematica.pt
          ./leviata exemplos/classes.pt
          ./leviata exemplos/construtores.pt
          ./leviata exemplos/modulos.pt
          ./leviata exemplos/modulos_alias.pt
          ./leviata exemplos/jogo.pt
          ./leviata exemplos/motor2d.pt
          ./leviata exemplos/mundo.pt
          ./leviata exemplos/gameplay.pt

      - name: Run core regression suite
        run: |
          ./leviata testes/nucleo.pt | tee /tmp/leviata-core.log
          grep -q "NUCLEO_OK" /tmp/leviata-core.log

      - name: Run collection regression suite
        run: |
          ./leviata testes/mapas.pt | tee /tmp/leviata-maps.log
          grep -q "MAPAS_OK" /tmp/leviata-maps.log

          ./leviata testes/mapas_iteracao.pt | tee /tmp/leviata-map-iteration.log
          grep -q "MAPAS_ITERACAO_OK" /tmp/leviata-map-iteration.log
          if grep -q "FALHA_" /tmp/leviata-map-iteration.log; then
            echo "ERRO: regressao na iteracao chave/valor"
            exit 1
          fi

          ./leviata testes/colecoes_iteracao.pt | tee /tmp/leviata-collection-iteration.log
          grep -q "COLECOES_ITERACAO_OK" /tmp/leviata-collection-iteration.log
          if grep -q "FALHA_" /tmp/leviata-collection-iteration.log; then
            echo "ERRO: regressao na iteracao dupla de colecoes"
            exit 1
          fi

          if ./leviata testes/mapas_chave_invalida.pt; then
            echo "ERRO: mapa aceitou indice numerico"
            exit 1
          fi

      - name: Run gameplay regression suite
        run: |
          ./leviata testes/gameplay.pt | tee /tmp/leviata-gameplay.log
          grep -q "GAMEPLAY_OK" /tmp/leviata-gameplay.log

      - name: Run resource object regression suite
        run: |
          ./leviata testes/recursos.pt | tee /tmp/leviata-resources.log
          grep -q "RECURSOS_OK" /tmp/leviata-resources.log
          rm -f testes/.recurso_tmp.txt testes/.recurso_tmp2.txt

      - name: Run class regression suite
        run: |
          ./leviata testes/classes.pt | tee /tmp/leviata-classes.log
          grep -q "CLASSES_OK" /tmp/leviata-classes.log

      - name: Run constructor regression suite
        run: |
          ./leviata testes/construtores.pt | tee /tmp/leviata-constructors.log
          grep -q "CONSTRUTORES_OK" /tmp/leviata-constructors.log

          if ./leviata testes/construtor_erro.pt; then
            echo "ERRO: construtor com aridade errada deveria falhar"
            exit 1
          fi

      - name: Run super regression suite
        run: |
          ./leviata testes/super.pt | tee /tmp/leviata-super.log
          grep -q "SUPER_OK" /tmp/leviata-super.log

          if ./leviata testes/super_sem_pai.pt; then
            echo "ERRO: super em classe sem pai deveria falhar"
            exit 1
          fi

          if ./leviata testes/super_fora_classe.pt; then
            echo "ERRO: super fora de classe deveria falhar"
            exit 1
          fi

      - name: Run module regression suite
        run: |
          ./leviata testes/modulos_main.pt | tee /tmp/leviata-modules.log
          grep -q "MODULOS_OK" /tmp/leviata-modules.log

          ./leviata testes/modulos_alias_main.pt | tee /tmp/leviata-module-alias.log
          grep -q "MOD_ALIAS_OK" /tmp/leviata-module-alias.log

          ./leviata testes/modulos_isolamento_main.pt | tee /tmp/leviata-module-isolation.log
          grep -q "MOD_ISOLAMENTO_OK" /tmp/leviata-module-isolation.log

          if ./leviata testes/modulos/ciclo_a.pt; then
            echo "ERRO: ciclo de modulos deveria falhar"
            exit 1
          fi

          if ./leviata testes/modulos_import_local.pt; then
            echo "ERRO: usar dentro de funcao deveria falhar"
            exit 1
          fi

          if ./leviata testes/modulos_export_local.pt; then
            echo "ERRO: exportar dentro de funcao deveria falhar"
            exit 1
          fi

          if ./leviata testes/modulos_alias_nao_exportado.pt; then
            echo "ERRO: alias nao deveria expor simbolo sem exportar"
            exit 1
          fi

          if ./leviata testes/modulos_isolamento_privado.pt; then
            echo "ERRO: simbolo privado vazou para o chamador"
            exit 1
          fi

          if ./leviata testes/modulos_isolamento_alias_vazamento.pt; then
            echo "ERRO: import com alias vazou exportacao sem prefixo"
            exit 1
          fi

      - name: Enforce Leviata 3 canonical surface
        run: |
          cat > /tmp/leviata-legado.pt <<'EOF'
          escrever("forma antiga")
          EOF
          if ./leviata /tmp/leviata-legado.pt; then
            echo "ERRO: escrever() antigo voltou a ser aceito"
            exit 1
          fi

          cat > /tmp/leviata-logica-antiga.pt <<'EOF'
          escreva(verdadeiro && falso)
          EOF
          if ./leviata /tmp/leviata-logica-antiga.pt; then
            echo "ERRO: && voltou a ser aceito como forma canônica"
            exit 1
          fi

      - name: Build with sanitizers
        run: make debug

      - name: Run regressions with sanitizers
        run: |
          ./leviata_debug testes/nucleo.pt
          ./leviata_debug testes/mapas.pt
          ./leviata_debug testes/mapas_iteracao.pt
          ./leviata_debug testes/colecoes_iteracao.pt
          ./leviata_debug testes/gameplay.pt
          ./leviata_debug testes/recursos.pt
          ./leviata_debug testes/classes.pt
          ./leviata_debug testes/construtores.pt
          ./leviata_debug testes/super.pt
          ./leviata_debug testes/modulos_main.pt
          ./leviata_debug testes/modulos_alias_main.pt
          ./leviata_debug testes/modulos_isolamento_main.pt
          rm -f testes/.recurso_tmp.txt testes/.recurso_tmp2.txt
